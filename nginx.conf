server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Compresión gzip para máxima velocidad
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Headers de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Favicon y assets raíz
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    location = /favicon.svg {
        access_log off;
        log_not_found off;
        expires 30d;
    }

    # Cache inmutable para assets con hash generados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Cache para imágenes estáticas
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Enrutamiento VitePress (soporta URLs limpias /cliente/pedidos -> /cliente/pedidos.html)
    location / {
        try_files $uri $uri.html $uri/ /index.html =404;
    }

    error_page 404 /404.html;
}
